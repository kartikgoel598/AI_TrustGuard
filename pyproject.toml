[project]
name = "ai-trustguard"
version = "0.1.0"
description = "AI TrustGuard — mechanistic interpretability based multi-layer AI security threat detection"
requires-python = ">=3.9"
 
[tool.setuptools]
packages = [
    "helper",
    "training",
    "dataset",
    "inference",
    "activation_capture",
    "detection",
    "agent",
    "integration",
    "dashboard",
]

py-modules = ["model_loader"]
 
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"